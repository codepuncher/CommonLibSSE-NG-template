name: Template Setup

on:
  push:
    branches: [main]
    paths: ['.github/template-setup-pending']
  workflow_dispatch:

jobs:
  setup:
    if: github.event.repository.is_template == false && github.repository != 'codepuncher/CommonLibSSE-NG-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Skip if already initialised
        id: guard
        run: |
          if [[ -f .github/template-setup-pending ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Project already initialised; nothing to do."
          fi

      - name: Derive mod name from repo name
        if: steps.guard.outputs.pending == 'true'
        id: names
        run: |
          REPO="${{ github.event.repository.name }}"
          # kebab-case or snake_case → PascalCase; strip separators left before digits
          MOD_NAME=$(echo "$REPO" | sed -E 's/(^|[-_]+)([a-z0-9])/\U\2/g; s/[-_]+//g')
          MOD_NAME_LOWER=$(echo "$MOD_NAME" | tr '[:upper:]' '[:lower:]')
          AUTHOR="${{ github.repository_owner }}"
          echo "mod_name=${MOD_NAME}"       >> "$GITHUB_OUTPUT"
          echo "mod_name_lower=${MOD_NAME_LOWER}" >> "$GITHUB_OUTPUT"
          echo "author=${AUTHOR}"           >> "$GITHUB_OUTPUT"

      - name: Replace placeholders
        if: steps.guard.outputs.pending == 'true'
        env:
          MOD_NAME: ${{ steps.names.outputs.mod_name }}
          MOD_NAME_LOWER: ${{ steps.names.outputs.mod_name_lower }}
          AUTHOR: ${{ steps.names.outputs.author }}
        run: |
          FILES=(
            CMakeLists.txt
            vcpkg.json
            README.md
          )
          for file in "${FILES[@]}"; do
            [[ -f "$file" ]] || continue
            sed -i \
              -e "s|examplemod|${MOD_NAME_LOWER}|g" \
              -e "s|ExampleMod|${MOD_NAME}|g" \
              -e "s|\"Author\"|\"${AUTHOR}\"|g" \
              "$file"
          done

      - name: Remove setup workflow and sentinel
        if: steps.guard.outputs.pending == 'true'
        run: |
          git rm -f --ignore-unmatch .github/workflows/setup.yml .github/template-setup-pending

      - name: Commit
        if: steps.guard.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: initialise project as ${{ steps.names.outputs.mod_name }}"
          git push
