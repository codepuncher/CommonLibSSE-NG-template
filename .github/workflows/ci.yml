name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # ilammy/msvc-dev-cmd and KyleMayes/install-llvm-action still run on node20;
  # this forces them onto node24 until they migrate.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      src:    ${{ steps.filter.outputs.src }}
      tests:  ${{ steps.filter.outputs.tests }}
      format: ${{ steps.filter.outputs.format }}
      tidy:   ${{ steps.filter.outputs.tidy }}
      cmake:  ${{ steps.filter.outputs.cmake }}
      ci:     ${{ steps.filter.outputs.ci }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
            tests:
              - 'test/**'
            format:
              - '.clang-format'
            tidy:
              - '.clang-tidy'
            cmake:
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'vcpkg.json'
            ci:
              - '.github/workflows/ci.yml'

  clang-format:
    needs: [changes]
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.format == 'true' ||
      needs.changes.outputs.ci == 'true'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: '22'
          check-path: src

      - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: '22'
          check-path: test

  test:
    needs: [changes, clang-format]
    runs-on: windows-latest

    if: >-
      always() &&
      (needs.clang-format.result == 'success' || needs.clang-format.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.src == 'true' ||
        needs.changes.outputs.tests == 'true' ||
        needs.changes.outputs.cmake == 'true' ||
        needs.changes.outputs.ci == 'true'
      )

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-prefix: vcpkg-tests

      - name: Configure and Build Tests
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: test-windows
          buildPreset: test-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

      - name: Run Tests
        run: ctest --preset test-windows

  build:
    needs: [changes, clang-format]
    runs-on: windows-latest

    if: >-
      always() &&
      (needs.clang-format.result == 'success' || needs.clang-format.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.src == 'true' ||
        needs.changes.outputs.cmake == 'true' ||
        needs.changes.outputs.ci == 'true'
      )

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure and Build
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: release-windows
          buildPreset: release-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}
          path: |
            build/msvc/*.dll
            build/msvc/*.pdb

  clang-tidy:
    needs: [changes, clang-format, build, test]
    runs-on: windows-latest

    if: >-
      always() &&
      (needs.clang-format.result == 'success' || needs.clang-format.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.src == 'true' ||
        needs.changes.outputs.tidy == 'true' ||
        needs.changes.outputs.cmake == 'true' ||
        needs.changes.outputs.ci == 'true'
      )

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          # VS 2026 STL on the windows-latest image requires Clang 20 or newer (STL1000).
          version: "21"

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: tidy-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

      - name: Run clang-tidy
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src -Include *.cpp -Recurse |
            Select-Object -ExpandProperty FullName
          clang-tidy.exe -p build/tidy $files
